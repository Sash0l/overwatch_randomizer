*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
button{font-family:inherit;color:inherit}
:root{
  --panel:#1a2438; --panel2:#101a2e; --line:rgba(255,255,255,.14);
  --txt:#fff; --dim:#aab6cf; --acc:#00b9f2; --ow:#ff9c1a;
  --tank:#ffae2b; --dps:#ff4c3f; --supp:#ff8cc8;
}
body{
  font-family:"FuturaOW","Jost","Segoe UI",system-ui,Arial,sans-serif;
  background:
    linear-gradient(112deg,transparent 0 34%,rgba(255,255,255,.16) 34%,rgba(255,255,255,.16) 42%,transparent 42%,transparent 58%,rgba(255,255,255,.11) 58%,rgba(255,255,255,.11) 64%,transparent 64%),
    linear-gradient(180deg,#9daad0,#75829f);
  background-attachment:fixed;
  color:var(--txt);min-height:100vh;
}
.wrap{max-width:920px;margin:0 auto;padding:48px 18px 44px}
header{display:block;background:linear-gradient(180deg,#141d31,#0d1424);padding:12px 18px;border-bottom:2px solid rgba(0,185,242,.4);box-shadow:0 6px 22px rgba(13,19,34,.4)}
.bar{max-width:920px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-family:"Big Noodle Too","Jost",sans-serif;font-size:clamp(1.7rem,4vw,2.5rem);font-weight:400;font-style:oblique;text-transform:uppercase;letter-spacing:.02em;line-height:1;color:#fff}
h1 .ow{color:var(--ow)}
.sub{color:var(--dim);margin-top:5px;font-size:.85rem;font-weight:400;letter-spacing:.03em}
#sound{background:rgba(255,255,255,.08);border:1px solid var(--line);color:#fff;width:42px;height:42px;border-radius:8px;font-size:1.1rem;cursor:pointer;flex:none;display:inline-flex;align-items:center;justify-content:center;line-height:1}
#sound:hover{background:rgba(255,255,255,.16)}
#sound svg{width:20px;height:20px;display:block}
.soundwrap{position:relative;flex:none}
.volpanel{position:absolute;top:calc(100% + 8px);right:0;width:34px;height:136px;background:#101a2e;border:1px solid var(--line);border-radius:10px;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 28px rgba(13,19,34,.55);z-index:5}
.volpanel input[type=range]{width:112px;transform:rotate(-90deg);accent-color:var(--acc);cursor:pointer}
.ibtn{background:none;border:none;color:#3d4d74;cursor:pointer;padding:2px;line-height:0;display:inline-flex}
.ibtn svg{width:15px;height:15px}
.ibtn:hover{color:#0077a8}
#clearHist:hover{color:#e0432f}

.row{display:flex;flex-wrap:wrap;gap:12px;align-items:stretch}
.filters{margin:0 0 10px;justify-content:center}
.chip{display:inline-flex;flex-direction:column;align-items:center;gap:9px;position:relative;background:linear-gradient(180deg,#1d2842,#131c30);border:2px solid rgba(255,255,255,.13);color:#fff;padding:26px 22px 22px;border-radius:8px;cursor:pointer;font-size:1rem;font-weight:400;letter-spacing:.04em;transition:.4s ease;line-height:1;min-width:150px;min-height:248px;text-transform:uppercase}
.chip:hover{border-color:rgba(255,255,255,.4);transform:scale(1.06)}
.chip svg{width:64px;height:64px;margin-top:40px}
.chip .lbl{margin-top:auto;font-size:.8rem}
.chip .cnt{font-weight:400;font-size:.78rem;color:var(--dim)}
.chip .ck{order:9}
.chip:not(.off){border-color:var(--acc);background:linear-gradient(180deg,#1e5fae,#123e7d);box-shadow:0 0 24px rgba(0,185,242,.35)}
.chip:not(.off):hover{border-color:#45d2ff}
.ck{flex:none;width:20px;height:20px;border-radius:4px;border:2px solid rgba(255,255,255,.55);position:relative;transition:.15s;cursor:pointer;background:rgba(13,19,34,.35);display:flex;align-items:center;justify-content:center}
.ck:hover{box-shadow:0 0 0 3px rgba(255,255,255,.15)}
.ck:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.ck[aria-checked="true"]{background:#fff;border-color:#fff}
.ck[aria-checked="true"]::after{content:"";width:10px;height:6px;border-left:3px solid #14213a;border-bottom:3px solid #14213a;transform:translateY(-1.8px) rotate(-45deg)}

.norep{display:flex;align-items:center;justify-content:center;gap:9px;margin:10px 0 0;color:#223252;font-size:.9rem;font-weight:400;cursor:pointer;user-select:none}
.norep input{position:absolute;opacity:0;width:0;height:0}
.norep input:checked+.ck{background:#fff;border-color:#fff}
.norep input:checked+.ck::after{content:"";width:10px;height:6px;border-left:3px solid #14213a;border-bottom:3px solid #14213a;transform:translateY(-1.8px) rotate(-45deg)}
.norep input:focus-visible+.ck{outline:2px solid var(--acc);outline-offset:2px}

.panel{position:relative;background:linear-gradient(180deg,rgba(26,36,56,.97),rgba(15,24,42,.97));border:1px solid rgba(255,255,255,.12);border-radius:10px;overflow:hidden;box-shadow:0 12px 32px rgba(13,19,34,.38)}
.hero{margin-top:18px;min-height:560px;padding:30px 26px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(420px 260px at 50% 0%,var(--glow,rgba(0,185,242,.12)),transparent 70%);pointer-events:none}
.hero::after{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--rolec,transparent)}

.pwrap{position:relative;width:200px;height:200px;border-radius:14px;border:3px solid var(--rolec,#3b4a63);background:radial-gradient(circle at 50% 25%,var(--glowc,rgba(0,185,242,.15)),#0f1a30 75%);box-shadow:0 0 34px var(--glowc,rgba(0,185,242,.12));transition:border-color .3s,box-shadow .3s}
.pwrap img{width:100%;height:100%;object-fit:contain;display:block;border-radius:inherit;transition:filter .15s,opacity .15s}
.pfall{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:"Big Noodle Too","Jost",sans-serif;font-size:3.2rem;font-weight:400;font-style:oblique;color:var(--rolec,#61749c);letter-spacing:.05em;border-radius:inherit}
.pwrap.spinning img{filter:blur(5px) saturate(.4);opacity:.45}
.pwrap.spinning::after{content:"";position:absolute;inset:-3px;border-radius:inherit;border:3px dashed rgba(255,255,255,.3);animation:spinring 1s linear infinite}
@keyframes spinring{to{transform:rotate(360deg)}}

.badge{display:inline-flex;align-items:center;gap:6px;padding:.3rem .75rem;border-radius:4px;font-size:.78rem;font-weight:400;text-transform:uppercase;letter-spacing:.14em;border:1.5px solid;background:rgba(255,255,255,.05);line-height:1}
.badge svg{width:12px;height:12px}
.name{font-family:"Big Noodle Too","Jost",sans-serif;font-size:clamp(2.4rem,8vw,4.6rem);font-weight:400;font-style:oblique;letter-spacing:0;text-transform:uppercase;line-height:1.05}
.hero.empty .name{color:#3b4a63}
.hero.spinning .badge,.hero.spinning .desc,.hero.spinning .ult,.hero.spinning .wikilink{opacity:.25}
.ru{color:var(--dim);letter-spacing:.24em;text-transform:uppercase;font-size:.82rem;font-weight:400}
.desc{max-width:58ch;color:#c9d3e6;line-height:1.5}
.ult{color:var(--dim)}
.ult b{color:#fff}
.wikilink{color:#8fa3c8;font-size:.8rem;text-decoration:none;border-bottom:1px dotted #8fa3c8}
.wikilink:hover{color:var(--acc);border-color:var(--acc)}

.rollbtn{margin:22px auto 4px;display:flex;align-items:center;justify-content:center;line-height:1;position:relative;padding:1rem 4.6rem;font-size:1.2rem;font-weight:400;font-style:normal;letter-spacing:.1em;text-transform:uppercase;color:#fff;background:#ee630f;border:none;border-radius:8px;cursor:pointer;transition:transform .15s}
.rollbtn:hover{transform:scale(1.04)}
.rollbtn:active{transform:translateY(1px) scale(.99)}
.rollbtn:disabled{opacity:.6;cursor:default}
.rollbtn::before,.chip::before{content:"";position:absolute;inset:-2px;border-radius:inherit;border:1.5px solid var(--acc);box-shadow:0 0 8px rgba(0,185,242,.35),inset 0 0 3px rgba(0,185,242,.2);pointer-events:none;opacity:0;transition:opacity .2s}
.rollbtn:hover::before,.chip:hover::before{opacity:1;animation:ringpulse 1s linear infinite}
.rollbtn:disabled::before{opacity:0}
@keyframes ringpulse{
  0%,100%{inset:-2px;border-width:1.5px;box-shadow:0 0 8px rgba(0,185,242,.35),inset 0 0 3px rgba(0,185,242,.2)}
  50%{inset:-6px;border-width:4px;box-shadow:0 0 16px rgba(0,185,242,.6),inset 0 0 6px rgba(0,185,242,.4)}
}
.hint{text-align:center;color:#2b3a5c;font-size:.85rem;margin-top:8px;font-weight:600}
.hint kbd{background:#101a2e;border:1px solid rgba(255,255,255,.18);border-bottom-width:2px;border-radius:4px;padding:1px 8px;color:#fff;font-family:inherit;font-weight:400}
.baginfo{color:#223252;font-size:.9rem;margin-top:6px;display:flex;align-items:center;justify-content:center;gap:7px;font-weight:400}
.baginfo.flash{color:#0089c2;animation:flash .8s}
.baginfo.pulse{animation:flash .8s}
@keyframes flash{0%,100%{opacity:1}50%{opacity:.35}}

.histhead{margin:30px 0 8px;color:#223252;font-size:.9rem;text-transform:uppercase;letter-spacing:.14em;font-weight:400;display:flex;align-items:center;gap:8px}
.hist{display:flex;flex-wrap:wrap;gap:8px}
.hchip{display:inline-flex;align-items:center;gap:7px;padding:.26rem .7rem .26rem .28rem;border-radius:6px;font-size:.92rem;font-weight:400;border:1px solid;background:rgba(16,26,46,.93);box-shadow:0 3px 10px rgba(13,19,34,.3)}
.hchip img{width:26px;height:26px;border-radius:4px;object-fit:contain;background:#0f1a30}
.hchip .ric{display:inline-flex;align-items:center;opacity:.85}
.hchip .ric svg{width:13px;height:13px;display:block}
.empty-note{color:#223252;font-size:.9rem;font-weight:400}

.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.burst{position:absolute;inset:0;pointer-events:none}
.spark{position:absolute;left:50%;top:23%;width:7px;height:7px;border-radius:50%;pointer-events:none;animation:fly .7s ease-out forwards}
@keyframes fly{from{transform:translate(-50%,-50%) scale(1);opacity:1}to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(0);opacity:0}}

@media (max-width:560px){.rollbtn{padding:1rem 2.6rem}.hero{min-height:520px}.chip{min-width:112px;padding:14px 14px 12px}}
</style>

  dps:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6.4 5.5c1.2 1.5 1.75 3.1 1.75 4.9v6.2c0 .8-.65 1.4-1.75 1.4s-1.75-.6-1.75-1.4v-6.2c0-1.8.55-3.4 1.75-4.9zM12 5.5c1.2 1.5 1.75 3.1 1.75 4.9v6.2c0 .8-.65 1.4-1.75 1.4s-1.75-.6-1.75-1.4v-6.2c0-1.8.55-3.4 1.75-4.9zM17.6 5.5c1.2 1.5 1.75 3.1 1.75 4.9v6.2c0 .8-.65 1.4-1.75 1.4s-1.75-.6-1.75-1.4v-6.2c0-1.8.55-3.4 1.75-4.9z"/></svg>',
  supp:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 4h6v5h5v6h-5v5H9v-5H4V9h5z"/></svg>'
};
const SND_ON='<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3z" fill="currentColor"/><path d="M14.8 8.7a4.4 4.4 0 0 1 0 6.6M17.2 6.2a8 8 0 0 1 0 11.6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
const SND_OFF='<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3z" fill="currentColor"/><path d="M16.2 9.2l5.6 5.6M21.8 9.2l-5.6 5.6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';

const $=s=>document.querySelector(s);
const heroCard=$("#heroCard"),pWrap=$("#pWrap"),pImg=$("#pImg"),pFall=$("#pFall"),
      badge=$("#badge"),hName=$("#hName"),hRu=$("#hRu"),hDesc=$("#hDesc"),
      hUlt=$("#hUlt"),wikiLink=$("#wikiLink"),burst=$("#burst"),
      rollBtn=$("#roll"),bagInfo=$("#bagInfo"),soundBtn=$("#sound"),
      bagText=$("#bagText"),volPanel=$("#volPanel"),volumeInput=$("#volume");

const state={
  roles:new Set(["tank","dps","supp"]),
  mode:"bag",               // bag | classic — мешок по умолчанию
  volume:0.5,               // 0..1, 0 = без звука
  history:[],
  spinning:false,
  cur:null
};
const bag={sig:null,items:{}}; // items[роль] = шарики в мешке этой роли

function pool(){
  return HEROES.filter(h=>state.roles.has(h.r));
}

// --- Сначала равновероятно роль, затем равновероятно герой внутри роли.
function pickClassic(p){
  const roles=[...state.roles];
  const role=roles[Math.floor(Math.random()*roles.length)];
  const cands=p.filter(h=>h.r===role);
  return cands[Math.floor(Math.random()*cands.length)];
}

// --- Мешки по ролям: у каждой роли свой мешок; сначала равновероятно выбирается роль,
// затем из её мешка вынимается шарик. Опустел — мешок роли наполняется заново.
function drawFromBag(p){
  const roles=[...state.roles];
  const sig=roles.map(r=>r+p.filter(h=>h.r===r).length).join("|");
  if(bag.sig!==sig){
    bag.sig=sig;
    const moved=[];
    for(const r in bag.items){
      bag.items[r]=bag.items[r].filter(h=>{
        if(h.r===r)return true;
        moved.push(h);return false;
      });
    }
    roles.forEach(r=>{if(!bag.items[r])bag.items[r]=p.filter(h=>h.r===r).slice();});
    for(const h of moved){
      if(!bag.items[h.r])bag.items[h.r]=HEROES.filter(x=>x.r===h.r);
      if(!bag.items[h.r].some(x=>x.n===h.n))bag.items[h.r].push(h);
    }
  }
  const role=roles[Math.floor(Math.random()*roles.length)];
  let refilled=false;
  if(!bag.items[role].length){
    bag.items[role]=p.filter(h=>h.r===role);
    refilled=true;
  }
  const i=Math.floor(Math.random()*bag.items[role].length);
  return {hero:bag.items[role].splice(i,1)[0],refilled,left:roles.reduce((s,r)=>s+bag.items[r].length,0),total:p.length};
}

function blip(f,d,type,g){
  if(!state.volume)return;
  try{
    blip.ctx=blip.ctx||new (window.AudioContext||window.webkitAudioContext)();
    if(blip.ctx.state==="suspended")blip.ctx.resume();
    const ac=blip.ctx,o=ac.createOscillator(),gn=ac.createGain(),t=ac.currentTime;
    const vol=(g||.04)*state.volume;
    o.type=type||"square";o.frequency.value=f;gn.gain.value=vol;
    o.connect(gn);gn.connect(ac.destination);
    gn.gain.setValueAtTime(vol,t);
    gn.gain.exponentialRampToValueAtTime(.0001,t+(d||.05));
    o.start(t);o.stop(t+(d||.05));
  }catch(e){}
}

function plural(n,one,few,many){
  const m10=n%10,m100=n%100;
  return (m10===1&&m100!==11)?one:(m10>=2&&m10<=4&&(m100<10||m100>=20))?few:many;
}

// --- Вшитые звуки: декодируем каждый один раз, дальше играем мгновенно.
// Пока файла нет (или декод не удался) — играет заглушка fallback.
const sndBuf={};
function decodeSnd(k){
  if(sndBuf[k]!==undefined||!SND[k])return;
  sndBuf[k]=null;
  try{
    blip.ctx=blip.ctx||new (window.AudioContext||window.webkitAudioContext)();
    fetch(SND[k]).then(r=>r.arrayBuffer()).then(b=>blip.ctx.decodeAudioData(b))
      .then(buf=>{sndBuf[k]=buf;}).catch(()=>{});
  }catch(e){}
}
const sndLast={};
function playSnd(k,fallback,mul,cut){
  if(!state.volume)return;
  const buf=sndBuf[k];
  if(!buf){if(fallback)fallback();return;}
  try{
    const ac=blip.ctx;
    if(ac.state==="suspended")ac.resume();
    if(cut&&sndLast[k]){try{sndLast[k].stop()}catch(e){}}
    const s=ac.createBufferSource(),g=ac.createGain();
    s.buffer=buf;g.gain.value=state.volume*(mul||1);
    s.connect(g);g.connect(ac.destination);s.start(0);
    sndLast[k]=s;
  }catch(e){}
}

function initials(name){
  let s="";
  for(const w of name.split(/\s+/)){
    const c=[...w].find(ch=>/[A-Za-z0-9]/.test(ch));
    if(c)s+=c.toUpperCase();
    if(s.length>=2)break;
  }
  return s||"?";
}

function showFallback(h){
  pImg.hidden=true;pFall.hidden=false;
  pFall.textContent=initials(h.n);
  pFall.style.background="radial-gradient(circle at 50% 30%,"+ROLE_COLOR[h.r]+"44,#101a2e)";
}

function showResult(h){
  state.cur=h;
  heroCard.classList.remove("empty");
  heroCard.style.setProperty("--rolec",ROLE_COLOR[h.r]);
  heroCard.style.setProperty("--glow",ROLE_GLOW[h.r]);
  pWrap.style.setProperty("--rolec",ROLE_COLOR[h.r]);
  pWrap.style.setProperty("--glowc",ROLE_GLOW[h.r]);
  if(h.p!==false&&PORTRAITS[h.n]){
    pImg.hidden=false;pFall.hidden=true;
    pImg.src=PORTRAITS[h.n];
  }else{
    showFallback(h);
  }
  badge.hidden=false;
  badge.style.color=ROLE_COLOR[h.r];
  badge.style.borderColor=ROLE_COLOR[h.r];
  badge.innerHTML=ICONS[h.r]+ROLE_LABEL[h.r];
  hName.textContent=h.n;hName.style.color=ROLE_COLOR[h.r];
  hRu.textContent=h.ru===h.n?"":h.ru;
  hDesc.textContent=h.t;hDesc.hidden=false;
  hUlt.innerHTML="Ульта: <b>"+(h.u||"—")+"</b>";hUlt.hidden=false;
  wikiLink.hidden=false;
  wikiLink.href="https://overwatch.fandom.com/wiki/"+encodeURIComponent(h.n);
}

function spawnBurst(role){
  burst.innerHTML="";
  for(let i=0;i<18;i++){
    const s=document.createElement("span");
    s.className="spark";
    const a=Math.random()*Math.PI*2,r=70+Math.random()*100;
    s.style.setProperty("--dx",Math.cos(a)*r+"px");
    s.style.setProperty("--dy",Math.sin(a)*r+"px");
    s.style.background=ROLE_COLOR[role];
    s.style.animationDelay=(Math.random()*.08)+"s";
    burst.appendChild(s);
  }
  setTimeout(()=>{burst.innerHTML="";},900);
}

function renderHistory(){
  const el=$("#history");
  if(!state.history.length){el.innerHTML='<span class="empty-note">пока пусто</span>';return;}
  el.innerHTML=state.history.map(h=>{
    const c=ROLE_COLOR[h.r];
    const img=h.p!==false&&PORTRAITS[h.n]?"<img src='"+PORTRAITS[h.n]+"' alt=''>":"";
    return "<span class='hchip' style='color:"+c+";border-color:"+c+"55'>"+img+h.n+"<span class='ric'>"+ICONS[h.r]+"</span></span>";
  }).join("");
}

function bagLeft(){
  const p=pool();
  if(!bag.sig)return p.length;
  let s=0;
  for(const r of state.roles){
    const items=bag.items[r];
    s+=items?items.length:p.filter(h=>h.r===r).length;
  }
  return s;
}

function updateBagInfo(left,total,refilled){
  if(state.mode!=="bag"){bagInfo.hidden=true;return;}
  bagInfo.hidden=false;
  bagText.textContent=left===total
    ?"Героев: "+total+" из "+total+" — полный набор"
    :"Героев: осталось "+left+" из "+total;
  if(refilled){
    bagText.textContent+=" · все герои снова в игре!";
    bagInfo.classList.remove("flash");void bagInfo.offsetWidth;bagInfo.classList.add("flash");
  }
}

function roll(){
  if(state.spinning)return;
  const p=pool();
  if(!p.length){
    heroCard.classList.add("empty","shake");
    setTimeout(()=>heroCard.classList.remove("shake"),450);
    hName.textContent="?";hName.style.color="";
    hDesc.hidden=false;hDesc.textContent="Сначала выбери хотя бы одну роль";
    hRu.textContent="";badge.hidden=true;hUlt.hidden=true;wikiLink.hidden=true;
    pImg.hidden=true;pFall.hidden=false;pFall.textContent="?";pFall.style.background="";
    pWrap.style.setProperty("--rolec","#39404e");pWrap.style.setProperty("--glowc","rgba(249,158,26,.10)");
    return;
  }
  let hero,refilled=false,left=0,total=p.length;
  if(state.mode==="bag"){
    const r=drawFromBag(p);
    hero=r.hero;refilled=r.refilled;left=r.left;
  }else{
    hero=pickClassic(p);
  }
  spin(hero,p,left,total,refilled);
}

function spin(final,p,left,total,refilled){
  state.spinning=true;rollBtn.disabled=true;
  pWrap.classList.add("spinning");heroCard.classList.add("spinning");
  badge.hidden=true;
  hName.style.color="#e9eefb";
  let i=0,delay=45;
  const steps=18;
  (function step(){
    if(i<steps){
      const h=p[Math.floor(Math.random()*p.length)];
      hName.textContent=h.n;
      playSnd("tick",()=>blip(320+Math.random()*180,.04,"square",.03));
      // встряхивание ровно на каждый тик, длится до следующего звука
      hName.animate(
        [{transform:"translateY(0) scale(1)"},{transform:"translateY(-3px) scale(1.02)"},{transform:"translateY(0) scale(1)"}],
        {duration:Math.max(40,Math.min(delay,150)),easing:"ease-out"}
      );
      i++;delay=Math.min(240,delay*1.16);
      setTimeout(step,delay);
    }else{
      pWrap.classList.remove("spinning");heroCard.classList.remove("spinning");
      showResult(final);
      state.history.unshift(final);
      if(state.history.length>14)state.history.pop();
      renderHistory();
      if(state.mode==="bag")updateBagInfo(left,total,refilled);
      saveSettings(); // история и мешок
      playSnd("win",()=>{blip(740,.14,"triangle",.05);setTimeout(()=>blip(1108,.22,"triangle",.05),90);},.12);
      spawnBurst(final.r);
      state.spinning=false;rollBtn.disabled=false;
    }
  })();
}

// ===== Управление =====
rollBtn.addEventListener("click",roll);
document.addEventListener("keydown",e=>{
  if(e.code!=="Space")return;
  const t=e.target;
  if(t&&(t.tagName==="BUTTON"||t.tagName==="INPUT"||t.classList.contains("ck")))return; // Space на контроле — пусть сработает он сам
  e.preventDefault();roll();
});

function refreshRoleChips(){
  document.querySelectorAll(".role-chip").forEach(chip=>{
    const on=state.roles.has(chip.dataset.r);
    chip.classList.toggle("off",!on);
    chip.querySelector(".ck").setAttribute("aria-checked",on?"true":"false");
  });
}
function rolesChanged(){
  if(state.mode==="bag"&&!state.spinning)updateBagInfo(bagLeft(),pool().length,false);
  refreshRoleChips();
  saveSettings();
}
document.querySelectorAll(".role-chip").forEach(chip=>{
  const r=chip.dataset.r;
  chip.querySelector(".cnt").textContent=HEROES.filter(h=>h.r===r).length;
  // клик по карточке — включить/выключить роль (галочка следует за состоянием)
  chip.addEventListener("click",()=>{
    if(state.roles.has(r))state.roles.delete(r);else state.roles.add(r);
    rolesChanged();
  });
  const ck=chip.querySelector(".ck");
  ck.addEventListener("keydown",e=>{
    if(e.code==="Space"||e.code==="Enter"){e.preventDefault();e.stopPropagation();chip.click();}
  });
});

const noRepeat=$("#noRepeat");
function refreshModeSeg(){noRepeat.checked=state.mode==="bag";}
noRepeat.addEventListener("change",()=>{
  state.mode=noRepeat.checked?"bag":"classic";
  bag.sig=null;bag.items={};
  if(state.mode==="bag")updateBagInfo(pool().length,pool().length,false);
  else bagInfo.hidden=true;
  saveSettings();
});

soundBtn.addEventListener("click",()=>{volPanel.hidden=!volPanel.hidden;});
volumeInput.addEventListener("input",()=>{
  state.volume=volumeInput.value/100;
  volumeInput.title="Громкость: "+volumeInput.value+"%";
  updateSoundIcon();
  saveSettings();
});
// клик мимо панели громкости — закрыть её
document.addEventListener("click",e=>{
  if(volPanel.hidden)return;
  if(e.target.closest&&!e.target.closest(".soundwrap"))volPanel.hidden=true;
});
function updateSoundIcon(){
  soundBtn.innerHTML=state.volume>0?SND_ON:SND_OFF;
}
$("#clearHist").addEventListener("click",()=>{
  state.history=[];
  renderHistory();
  saveSettings();
});
$("#bagReset").addEventListener("click",()=>{
  bag.sig=null;bag.items={};
  if(state.mode==="bag"){
    updateBagInfo(pool().length,pool().length,false);
    bagInfo.classList.remove("pulse");void bagInfo.offsetWidth;bagInfo.classList.add("pulse");
  }
  saveSettings();
});

function saveSettings(){
  try{
    localStorage.setItem("owr2",JSON.stringify({
      volume:state.volume,mode:state.mode,roles:[...state.roles],
      history:state.history.map(h=>h.n),
      bag:{sig:bag.sig,items:Object.fromEntries(Object.entries(bag.items).map(([r,arr])=>[r,arr.map(h=>h.n)]))}
    }));
  }catch(e){}
}
(function loadSettings(){
  let s=null;
  try{s=JSON.parse(localStorage.getItem("owr2")||"null");}catch(e){}
  if(s){
    state.volume=typeof s.volume==="number"?Math.min(1,Math.max(0,s.volume)):(s.muted?0:0.5);
    if(s.muted)state.volume=0; // совместимость со старой настройкой «звук вкл/выкл»
    state.mode=s.mode==="classic"?"classic":"bag"; // по умолчанию — мешок
    if(Array.isArray(s.roles)){
      state.roles=new Set(s.roles.filter(r=>["tank","dps","supp"].includes(r)));
      if(!state.roles.size)state.roles=new Set(["tank","dps","supp"]);
    }
    if(Array.isArray(s.history)){
      state.history=s.history.map(n=>HEROES.find(h=>h.n===n)).filter(Boolean).slice(0,14);
    }
    if(s.bag&&typeof s.bag==="object"){
      if(typeof s.bag.sig==="string")bag.sig=s.bag.sig;
      if(s.bag.items&&typeof s.bag.items==="object"){
        bag.items={};
        for(const[r,arr]of Object.entries(s.bag.items)){
          if(!["tank","dps","supp"].includes(r))continue;
          bag.items[r]=(Array.isArray(arr)?arr:[]).map(n=>HEROES.find(h=>h.n===n)).filter(Boolean);
        }
      }
    }
  }
  volumeInput.value=Math.round(state.volume*100);
  volumeInput.title="Громкость: "+volumeInput.value+"%";
  updateSoundIcon();
})();

pImg.addEventListener("error",()=>{if(state.cur)showFallback(state.cur);});

$("#total").textContent=HEROES.length+" "+plural(HEROES.length,"герой","героя","героев");
for(const k in SND)decodeSnd(k); // вшитые звуки готовим заранее, чтобы сыграли без задержки
refreshRoleChips();
refreshModeSeg();
renderHistory();
if(state.mode==="bag")updateBagInfo(bagLeft(),pool().length,false);
</script>
</body>
</html>
